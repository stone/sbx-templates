command:
  kubectl version --client:
    exit-status: 0
    stdout:
      - "Client Version"
  kind --version:
    exit-status: 0
    stdout:
      - "kind version"
  flux --version:
    exit-status: 0
    stdout:
      - "flux version"
  goss --version:
    exit-status: 0
    stdout:
      - "goss version"
  container-structure-test version:
    exit-status: 0
    stdout:
      - '/^[0-9]+\.[0-9]+\.[0-9]+/'
  age --version:
    exit-status: 0
    stdout:
      - '/^v[0-9]+\.[0-9]+\.[0-9]+/'
  age-keygen --version:
    exit-status: 0
    stdout:
      - '/^v[0-9]+\.[0-9]+\.[0-9]+/'
  sops --version --disable-version-check:
    exit-status: 0
    stdout:
      - "sops"

file:
  /home/agent/.local/bin/kubectl:
    exists: true
    mode: "0755"
  /home/agent/.local/bin/kind:
    exists: true
    mode: "0755"
  /home/agent/.local/bin/flux:
    exists: true
    mode: "0755"
  /home/agent/.local/bin/goss:
    exists: true
    mode: "0755"
  /home/agent/.local/bin/dgoss:
    exists: true
    mode: "0755"
  /home/agent/.local/bin/container-structure-test:
    exists: true
    mode: "0755"
  /home/agent/.local/bin/age:
    exists: true
    mode: "0755"
  /home/agent/.local/bin/age-keygen:
    exists: true
    mode: "0755"
  /home/agent/.local/bin/sops:
    exists: true
    mode: "0755"
